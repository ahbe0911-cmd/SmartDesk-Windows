name: Capture SmartDesk V8 UI

on:
  workflow_dispatch:
  push:
    branches: [feature/reference-ui-v8]
    paths:
      - '.github/workflows/v6-ui-screenshot.yml'
      - 'tools/SmartDesk.UiCapture/**'
      - 'src/SmartDesk/Views/DashboardView.xaml'
      - 'src/SmartDesk/Views/DashboardView.xaml.cs'
      - 'src/SmartDesk/Views/AnalogClockControl.cs'

jobs:
  screenshot:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Ensure Vazirmatn font resource
        shell: pwsh
        run: |
          $fontDir = 'src/SmartDesk/Resources/Fonts'
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          if (-not (Test-Path "$fontDir/Vazirmatn.ttf")) {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' -OutFile "$fontDir/Vazirmatn.ttf"
          }
      - name: Add supplied Persian application fonts
        shell: pwsh
        run: |
          $fontDir = 'src/SmartDesk/Resources/Fonts'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/mohammadhasananisi/personal_accountant/main/assets/fonts/Far_Nazanin.ttf' -OutFile "$fontDir/Far_Nazanin.ttf"
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/negin-amiri/my-dijikala-clone/main/fonts/titr/Far_TitrBd.ttf' -OutFile "$fontDir/Far_TitrBd.ttf"
          if ((Get-Item "$fontDir/Far_Nazanin.ttf").Length -lt 50000) { throw 'Far Nazanin font download is incomplete.' }
          if ((Get-Item "$fontDir/Far_TitrBd.ttf").Length -lt 50000) { throw 'Far Titr font download is incomplete.' }

      - name: Build real WPF capture harness
        shell: pwsh
        run: dotnet build tools/SmartDesk.UiCapture/SmartDesk.UiCapture.csproj -c Release
      - name: Render actual V8 DashboardView
        shell: pwsh
        run: dotnet run --project tools/SmartDesk.UiCapture/SmartDesk.UiCapture.csproj -c Release --no-build
      - name: Collect rendered PNG
        shell: pwsh
        run: |
          $shot = Get-ChildItem -Path tools/SmartDesk.UiCapture/bin/Release -Filter 'SmartDesk-V8-real-render.png' -Recurse | Select-Object -First 1
          if (-not $shot) { throw 'Rendered V8 screenshot was not created.' }
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          Copy-Item $shot.FullName screenshots/SmartDesk-V8-real-render.png
          Write-Host "Captured: $($shot.FullName)"
          Write-Host "Size: $($shot.Length) bytes"
      - name: Upload real rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: SmartDesk-V8-Real-Rendered-Screenshot
          path: screenshots/SmartDesk-V8-real-render.png
          if-no-files-found: error
          retention-days: 7
