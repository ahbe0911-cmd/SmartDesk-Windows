name: Build SmartDesk Windows

on:
  push:
    branches: [main, feature/dashboard-v5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartdesk-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 10/11 x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/SmartDesk/SmartDesk.csproj

      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish src/SmartDesk/SmartDesk.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$env:GITHUB_WORKSPACE\publish\win-x64" `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Download official WebView2 bootstrapper
        shell: pwsh
        run: |
          $target = "$env:GITHUB_WORKSPACE\installer\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $target `
            -UseBasicParsing
          if ((Get-Item $target).Length -lt 100000) {
            throw "WebView2 bootstrapper download is incomplete."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $publishDir = "$env:GITHUB_WORKSPACE\publish\win-x64"
          & $iscc "/DPublishDir=$publishDir" "$env:GITHUB_WORKSPACE\installer\SmartDesk.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Create portable package and checksums
        shell: pwsh
        run: |
          $portable = "$env:GITHUB_WORKSPACE\artifacts\SmartDesk-Portable-Windows-x64.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\win-x64\*" -DestinationPath $portable -CompressionLevel Optimal
          Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartDesk-Setup-Windows-x64
          path: |
            artifacts/SmartDesk-Setup-Windows-x64.exe
            artifacts/SmartDesk-Setup-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: SmartDesk-Portable-Windows-x64
          path: |
            artifacts/SmartDesk-Portable-Windows-x64.zip
            artifacts/SmartDesk-Portable-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
